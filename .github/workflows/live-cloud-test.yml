name: Live Cloud Test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live_cloud_test:
    name: Live cloud test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      THINGS3_EMAIL: ${{ secrets.THINGS3_LIVE_TEST_EMAIL }}
      THINGS3_PASSWORD: ${{ secrets.THINGS3_LIVE_TEST_PASSWORD }}
      THINGS3_LIVE_TEST: "1"
      THINGS3_LIVE_TEST_DELAY: "0.5"
      THINGS3_BIN: ./target/debug/things3
      XDG_STATE_HOME: /tmp/things3-live-state

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Validate required secrets
        run: |
          if [[ -z "$THINGS3_EMAIL" || -z "$THINGS3_PASSWORD" ]]; then
            echo "Missing THINGS3_LIVE_TEST_EMAIL or THINGS3_LIVE_TEST_PASSWORD secret"
            exit 1
          fi

      - name: Check live test script syntax
        run: bash -n scripts/live-capability-test.sh

      - name: Build debug binary
        run: cargo build --locked

      - name: Run live cloud test
        run: scripts/live-capability-test.sh
